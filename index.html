<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>thewebsite.com.au — every website wraps the next</title>
  <meta name="description" content="A website about websites. Every website wraps the next.">
  <meta name="theme-color" content="#060908">
  <meta property="og:title" content="thewebsite.com.au">
  <meta property="og:description" content="Every website, wrapped in the next.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <!--
    ADDING A SITE
    Append one object to PROJECTS in main.js:
      { name, url, shot, embed }
    name  — corner label
    url   — host only
    shot  — /shots preview used while zooming (and if embed is false)
    embed — false if the site blocks iframes (X-Frame-Options)
  -->
  <div class="w3 is-latched" data-w3="root" tabindex="0" aria-label="thewebsite.com.au. Turn the dial to choose a scroll mode, then press refresh to turn that mode on or off. Hover the dial to read how the mode works.">
    <div class="w3-sticky">
      <h1 class="w3-sr">thewebsite.com.au — every website wraps the next</h1>
      <p class="w3-sr" data-w3="live" aria-live="polite">Now showing 00, thewebsite.com.au.</p>

      <!-- latched site: live page (or shot fallback) -->
      <div class="w3-page" data-w3="page" hidden>
        <iframe class="w3-frame" data-w3="frame" title="Site" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div class="w3-page-shot" data-w3="pageshot" hidden></div>
      </div>

      <!-- nested layers (visual tunnel / centre portal) -->
      <div class="w3-stage" data-w3="stage" aria-hidden="true"></div>
      <div class="w3-portal" data-w3="portal"><span>Scroll here to see more.</span></div>
      <div class="w3-rail" data-w3="rail">scroll</div>
      <div class="w3-edge is-top" data-w3="edge"></div>
      <div class="w3-edge is-bottom" data-w3="edge"></div>
      <div class="w3-seam" data-w3="seam">Scroll for the next site</div>
      <div class="w3-bay" data-w3="bay">Scroll here</div>
      <div class="w3-hold" data-w3="hold">Hold</div>
      <div class="w3-catch" data-w3="catch" hidden></div>

      <!-- outer border: zoom between layers when latched -->
      <div class="w3-zoom" data-w3="zoom" aria-hidden="true">
        <i class="is-t"></i><i class="is-r"></i><i class="is-b"></i><i class="is-l"></i>
      </div>

      <div class="w3-ui is-tl">
        <button type="button" class="w3-btn is-ink" data-w3="home" aria-label="thewebsite.com.au, back to the surface">
          <span>thewebsite.com.au<span class="w3-trail" data-w3="trail">/</span></span>
        </button>
      </div>
      <div class="w3-ui is-tr">
        <button type="button" class="w3-btn" data-w3="auto" aria-pressed="false" aria-label="Keep zooming on its own" style="font-size:17px">∞</button>
        <a class="w3-btn" href="https://camdouglas.com">contact</a>
      </div>
      <div class="w3-ui is-dial" data-w3="modes">
        <div class="w3-dial" data-w3="dial" tabindex="0" role="slider" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1" aria-label="Scroll mode">
          <i class="w3-tick" aria-hidden="true"></i>
          <span data-w3="dial-num">1</span>
        </div>
        <button type="button" class="w3-btn" data-w3="apply" aria-pressed="false" aria-label="Enable or disable this mode">↻</button>
        <p class="w3-tip" data-w3="tip" role="tooltip"></p>
      </div>
      <div class="w3-ui is-bl">
        <span data-w3="hint">pick a mode, then press refresh</span>
        <button type="button" class="w3-btn" data-w3="chip">Next site</button>
        <button type="button" class="w3-btn" data-w3="leave">Leave site</button>
      </div>
      <div class="w3-ui is-br" data-w3="current"></div>
    </div>
  </div>
</body>
</html>
